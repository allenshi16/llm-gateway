services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - gateway-redis:/data

  litellm:
    # Local-only fallback. Production must override this with an immutable digest
    # and pass the release/cosign gates before enabling the profile.
    # host networking: this machine's docker bridge NAT breaks outbound TLS;
    # binding on the host stack is verified working and keeps LiteLLM private.
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.95.1}
    profiles: ["litellm"]
    network_mode: host
    command: ["--config", "/app/config.yaml", "--port", "4302"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-local-disabled-litellm-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY required for provider routes}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

volumes:
  gateway-postgres:
  gateway-redis:
