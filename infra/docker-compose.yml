services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - gateway-postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - gateway-redis:/data

  litellm:
    # Local-only fallback. Production must override this with an immutable digest
    # and pass the release/cosign gates before enabling the profile.
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.95.1}
    profiles: ["litellm"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-local-disabled-litellm-key}
      DATABASE_URL: ${DATABASE_URL:-postgresql://gateway:gateway@postgres:5432/gateway}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4302:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gateway-postgres:
  gateway-redis:
